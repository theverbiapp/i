<style>
  /* Design 8.6 tokens, with three deliberate departures.
     The app accepts two sub-AA contrasts (D-13) because reworking a shipped
     palette was out of scope; a brand-new page has no such excuse, so every
     text pair here clears WCAG AA 4.5:1. Measured:

       copy + secondary button   #5B4FD6 on #FFFFFF  5.94:1
                                 #A99BFF on #1C1C1E  7.15:1
       step number bubble        #FFFFFF on #5B4FD6  5.94:1
                                 #1C1C1E on #A99BFF  7.23:1
       primary button, both ends #FFFFFF on #7B2FFF  5.69:1
                                 #FFFFFF on #1F6AE0  5.00:1
       body text, light          #6C6C70 on #F2F2F7  4.69:1
       body text, dark           #8E8E93 on #000000  6.44:1
       the code itself           18.82:1 / 21.00:1

     What that cost: the app's #6B5FFF accent is 4.46:1 on white and 3.81:1 on
     a dark card, so it became #5B4FD6 / #A99BFF for anything that is text or
     carries a number. The gradient's blue end #2F80FF gave white 16px text
     only 3.72:1, so it ends at #1F6AE0 here. #6B5FFF still fills the brand
     mark via the gradient, so the token itself is gone from this page. */
  :root {
    --bg: #F2F2F7;
    --card: #FFFFFF;
    --text: #000000;
    --text-2: #6C6C70;
    --hairline: #E5E5EA;
    --accent: #5B4FD6;       /* every text colour and the step bubbles */
    --on-accent: #FFFFFF;    /* the step number, which sits on --accent */
    --grad-a: #7B2FFF;
    --grad-b: #1F6AE0;
    --code-bg: #F2F2F7;
    --shadow: 0 6px 12px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1C1C1E;
      --text: #FFFFFF;
      --text-2: #8E8E93;
      --hairline: #3A3A3C;
      --code-bg: #000000;
      --shadow: none;
      --accent: #A99BFF;
      /* The dark accent is a light purple, so the number on it goes dark.
         Leaving it white was 2.38:1 and unreadable. */
      --on-accent: #1C1C1E;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 400 17px/1.47 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 24px 16px 40px;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 420px; }
  .brand {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin: 8px 0 28px;
  }
  /* The real app icon, inlined as a data URI. The page is allowed no network
     of any kind (PRD US-9.3), so a linked image is not an option — and the
     icon is what the friend will recognise on their home screen afterwards.
     22.5% is iOS's own corner radius as a share of icon width, so the square
     artwork is masked the way the system masks it. */
  .brand-mark {
    width: 34px; height: 34px; border-radius: 22.5%;
    display: block; flex: 0 0 auto;
  }
  .brand-name { font-size: 20px; font-weight: 700; letter-spacing: -.2px; }
  h1 {
    font-size: 26px; line-height: 1.25; font-weight: 700;
    letter-spacing: -.4px; margin: 0 0 8px; text-align: center;
  }
  .lede { color: var(--text-2); margin: 0 0 24px; text-align: center; font-size: 16px; }
  .card {
    background: var(--card); border-radius: 16px; padding: 20px;
    box-shadow: var(--shadow); margin-bottom: 16px;
  }
  .code-label {
    font-size: 12px; font-weight: 700; letter-spacing: .6px;
    text-transform: uppercase; color: var(--text-2); text-align: center;
    margin-bottom: 12px;
  }
  .code {
    font: 700 34px/1.1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 5px; text-align: center; color: var(--text);
    background: var(--code-bg); border: 1px solid var(--hairline);
    border-radius: 12px; padding: 16px 12px 16px 17px;
    word-break: break-all;
  }
  .copy {
    width: 100%; margin-top: 12px; padding: 13px 16px;
    font: 600 16px/1 inherit; font-family: inherit;
    color: var(--accent); background: transparent;
    border: 1px solid var(--hairline); border-radius: 12px;
    cursor: pointer; min-height: 44px;
  }
  .copy:active { opacity: .6; }
  .copy[data-done="1"] { color: var(--text-2); }
  ol { margin: 0; padding: 0; list-style: none; counter-reset: step; }
  ol li {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 10px 0; counter-increment: step;
  }
  ol li::before {
    content: counter(step);
    flex: 0 0 24px; height: 24px; margin-top: 1px;
    background: var(--accent); color: var(--on-accent); border-radius: 50%;
    font-size: 13px; font-weight: 700; line-height: 24px; text-align: center;
  }
  .stores { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .store {
    display: block; text-align: center; text-decoration: none;
    padding: 15px 18px; border-radius: 14px; font-weight: 600; font-size: 16px;
    min-height: 44px;
  }
  .store.primary { background: linear-gradient(135deg, var(--grad-a), var(--grad-b)); color: #FFF; }
  .store.secondary { background: var(--card); color: var(--accent); border: 1px solid var(--hairline); }
  .soon {
    text-align: center; color: var(--text-2); font-size: 15px;
    padding: 14px 10px 4px;
  }
  .fine { color: var(--text-2); font-size: 13px; text-align: center; margin: 22px 0 0; }
  [hidden] { display: none !important; }
</style>
</head>

  function readCode() {

    var query = /[?&]c=([^&]+)/.exec(window.location.search);
    if (query) { candidates.push(decodeURIComponent(query[1])); }

    return webURL;
  }

  /// `replace`, not `assign`: the back button then returns to the chat the
  /// link was tapped in, where the code is still on screen. An extra history
  /// entry would put this page in the way of the one thing the friend needs
  /// to go back for.
  ///
  /// If the store app's scheme goes nowhere — an in-app browser that blocks
  /// custom schemes, or a device with the store restricted — nothing happens
  /// and this page simply stays up, showing the code and a working button.
  /// That is the reason the page is painted before this runs.
  function redirect(code) {
    var web = webStoreURL(code);
    if (!web) { return false; }
    window.location.replace(storeAppURL(web) || web);
    return true;
  }

  function render() {
    var t = STRINGS[pickLanguage()];
    var code = readCode();

    document.documentElement.lang = pickLanguage();
    document.title = code ? t.title : "Verbi";

    document.getElementById("headline").textContent = code ? t.headline : t.noCode;
    document.getElementById("lede").textContent = code ? t.lede : t.noCodeLede;
    document.getElementById("fine").textContent = code ? t.fine : "";

    if (code) {
      document.getElementById("code-card").hidden = false;
      document.getElementById("code-label").textContent = t.codeLabel;
      document.getElementById("code").textContent = code;

      var button = document.getElementById("copy");
      button.textContent = t.copy;
      button.addEventListener("click", function () {
        copy(code, function () {
          button.textContent = t.copied;
          button.setAttribute("data-done", "1");
        });
      });
    }

    // Step 2 is the load-bearing sentence on this page: installing from a
    // store loses whatever was in the link, so the friend has to carry the
    // code across by hand. That is also why there is no deferred deep link
    // to build (D-44).
    //
    // With no code there is nothing to carry across and no reward to promise,
    // so the numbered list goes away entirely rather than counting down to a
    // step the visitor cannot take.
    if (code) {
      document.getElementById("step-1").textContent = t.s1;
      document.getElementById("step-2").textContent = t.s2;
      document.getElementById("step-3").textContent = t.s3;
    } else {
      document.getElementById("steps-card").hidden = true;
    }

    var stores = document.getElementById("stores");
    // The buttons stay https. A tap gets the universal-link treatment that a
    // scripted redirect does not, and https is the only form a desktop
    // browser can follow at all.
    var androidFirst = isAndroid();
    var buttons = [];

    if (PLAY_STORE_URL) {
      buttons.push({ el: storeButton(APP_STORE_URL, t.ios, !androidFirst), android: false });
      buttons.push({ el: storeButton(PLAY_STORE_URL, t.android, androidFirst), android: true });
      if (androidFirst) { buttons.reverse(); }
      buttons.forEach(function (b) { stores.appendChild(b.el); });
    } else {
      stores.appendChild(storeButton(APP_STORE_URL, t.ios, true));
      var soon = document.getElementById("soon");
      soon.textContent = t.soon;
      soon.hidden = false;
    }
  }

  function copy(text, done) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text, done); });
      return;
    }
    fallbackCopy(text, done);
  }

  function fallbackCopy(text, done) {
    var field = document.createElement("textarea");
    field.value = text;
    field.setAttribute("readonly", "");
    field.style.position = "fixed";
    field.style.opacity = "0";
    document.body.appendChild(field);
    field.select();
    field.setSelectionRange(0, text.length);
    try { document.execCommand("copy"); done(); } catch (e) { /* the code is on screen anyway */ }
    document.body.removeChild(field);
  }

  render();

  // Painted first, then redirected. The page stays the fallback for every
  // case the redirect cannot serve — no Play Store address yet, JavaScript
  // off, an in-app browser that blocks navigation — and in those cases it is
  // the whole experience, not a flash.
  redirect(readCode());
})();
</script>
</body>
</html>
